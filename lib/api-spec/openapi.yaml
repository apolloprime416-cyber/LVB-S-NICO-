openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and registration
  - name: me
    description: Authenticated client actions
  - name: admin
    description: Admin panel operations
  - name: public
    description: Public endpoints (key reset and extension validation)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new client account (pending approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered, awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /auth/verify-code:
    post:
      operationId: verifyCode
      tags: [auth]
      summary: Verify the admin second-factor code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Error"

  /me/keys:
    get:
      operationId: getMyKeys
      tags: [me]
      summary: List keys owned by the current client
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Key"
        "401":
          $ref: "#/components/responses/Error"

  /me/keys/activate:
    post:
      operationId: activateKey
      tags: [me]
      summary: Claim and activate a key by code (starts the timer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyCodeInput"
      responses:
        "200":
          description: Activated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /me/keys/{id}/reset-device:
    post:
      operationId: resetMyKeyDevice
      tags: [me]
      summary: Reset the device binding of one of my keys
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /me/trial:
    post:
      operationId: generateTrial
      tags: [me]
      summary: Generate a free 15-minute trial key (requires owning at least one paid key)
      responses:
        "201":
          description: Trial key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          $ref: "#/components/responses/Error"

  /admin/users:
    get:
      operationId: getUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"

  /admin/users/{id}/approve:
    post:
      operationId: approveUser
      tags: [admin]
      summary: Approve a pending user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/users/{id}/reject:
    post:
      operationId: rejectUser
      tags: [admin]
      summary: Reject a user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/users/{id}/password:
    post:
      operationId: setUserPassword
      tags: [admin]
      summary: Change a user's password
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/users/{id}:
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/keys:
    get:
      operationId: getKeys
      tags: [admin]
      summary: List all keys
      parameters:
        - name: plan
          in: query
          required: false
          schema:
            type: string
            enum: [trial, daily, weekly, monthly, lifetime]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [inactive, active, expired, revoked]
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Key"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: generateKeys
      tags: [admin]
      summary: Generate one or many keys (optionally assigned to a user email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyGenerateInput"
      responses:
        "201":
          description: Generated keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Key"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /admin/keys/{id}/revoke:
    post:
      operationId: revokeKey
      tags: [admin]
      summary: Revoke a key
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/keys/{id}/reset-device:
    post:
      operationId: resetKeyDevice
      tags: [admin]
      summary: Reset the device binding of a key
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/keys/{id}:
    delete:
      operationId: deleteKey
      tags: [admin]
      summary: Delete a key
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /public/reset-key:
    post:
      operationId: publicResetKey
      tags: [public]
      summary: Public endpoint for a user to reset the device binding of their key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyCodeInput"
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"
        "404":
          $ref: "#/components/responses/Error"

  /public/validate:
    post:
      operationId: validateKey
      tags: [public]
      summary: Validate and bind a key for the extension (starts the timer on first use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResult"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    OkResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
    PasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 6
    KeyCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
    ValidateInput:
      type: object
      required: [code, fingerprint]
      properties:
        code:
          type: string
        fingerprint:
          type: string
    KeyGenerateInput:
      type: object
      required: [plan, quantity]
      properties:
        plan:
          type: string
          enum: [trial, daily, weekly, monthly, lifetime]
        quantity:
          type: integer
          minimum: 1
          maximum: 500
        userEmail:
          type: ["string", "null"]
          format: email
    AuthResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, code_required, pending, rejected]
        user:
          oneOf:
            - $ref: "#/components/schemas/SessionUser"
            - type: "null"
    SessionUser:
      type: object
      required: [id, name, email, role, status]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, client]
        status:
          type: string
          enum: [pending, approved, rejected]
    User:
      type: object
      required: [id, name, email, role, status, keyCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, client]
        status:
          type: string
          enum: [pending, approved, rejected]
        keyCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    Key:
      type: object
      required: [id, code, plan, status, createdAt]
      properties:
        id:
          type: string
        code:
          type: string
        plan:
          type: string
          enum: [trial, daily, weekly, monthly, lifetime]
        status:
          type: string
          enum: [inactive, active, expired, revoked]
        userId:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
        deviceFingerprint:
          type: ["string", "null"]
        activatedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    AdminStats:
      type: object
      required:
        - totalUsers
        - pendingUsers
        - approvedUsers
        - totalKeys
        - activeKeys
        - inactiveKeys
        - expiredKeys
        - revokedKeys
        - planCounts
      properties:
        totalUsers:
          type: integer
        pendingUsers:
          type: integer
        approvedUsers:
          type: integer
        totalKeys:
          type: integer
        activeKeys:
          type: integer
        inactiveKeys:
          type: integer
        expiredKeys:
          type: integer
        revokedKeys:
          type: integer
        planCounts:
          $ref: "#/components/schemas/PlanCounts"
    PlanCounts:
      type: object
      required: [trial, daily, weekly, monthly, lifetime]
      properties:
        trial:
          type: integer
        daily:
          type: integer
        weekly:
          type: integer
        monthly:
          type: integer
        lifetime:
          type: integer
    ResetResult:
      type: object
      required: [ok, plan]
      properties:
        ok:
          type: boolean
        plan:
          type: string
    ValidateResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        reason:
          type: ["string", "null"]
        plan:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
